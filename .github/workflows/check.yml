name: Check atlas
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.3'
      - run: node tools/install-offline.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo
      - run: npm run build
      - run: npm run authoring:build
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-development-build
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-authoring-tools
          path: build/authoring
